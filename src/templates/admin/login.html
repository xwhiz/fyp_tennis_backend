<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AceVision Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-black text-white">
    <div class="flex min-h-screen items-center justify-center px-6">
      <div class="w-full max-w-md rounded-2xl border border-green-500/50 bg-zinc-950 p-8 shadow-[0_0_40px_rgba(34,197,94,0.12)]">
        <p class="mb-2 text-sm uppercase tracking-[0.3em] text-green-400">AceVision</p>
        <h1 class="mb-6 text-3xl font-semibold text-white">Admin Login</h1>
        {% if error %}
        <div class="mb-4 rounded-xl border border-red-500/50 bg-red-950/40 px-4 py-3 text-sm text-red-200">
          {{ error }}
        </div>
        {% endif %}
        <form method="post" action="/admin/login" class="space-y-4">
          <div>
            <label class="mb-2 block text-sm text-zinc-300">Email</label>
            <input
              type="email"
              name="email"
              required
              class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-3 text-white outline-none transition focus:border-green-400"
            />
          </div>
          <div>
            <label class="mb-2 block text-sm text-zinc-300">Password</label>
            <input
              type="password"
              name="password"
              required
              class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-3 text-white outline-none transition focus:border-green-400"
            />
          </div>
          <button
            type="submit"
            class="w-full rounded-xl bg-green-500 px-4 py-3 font-medium text-black transition hover:bg-green-400"
          >
            Enter Dashboard
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
