version: "3.9"

services:
  api:
    build: .
    container_name: tennis_api
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 7000"
    entrypoint: /entrypoint.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
    ports:
      - "7000:7000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq

  celery_worker:
    build: .
    runtime: nvidia
    container_name: tennis_celery_worker
    command: uv run celery -A src.celery.worker worker --loglevel=info --concurrency=1
    entrypoint: /entrypoint.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  flower:
    build: .
    container_name: tennis_flower
    command: uv run celery --broker=amqp://guest:guest@rabbitmq:5672// flower --port=5555
    entrypoint: /entrypoint.sh
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app
    ports:
      - "5556:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    container_name: tennis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: tennis_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: tennis_redis
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tennis_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
