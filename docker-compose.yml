# One image for api / celery / flower: same build, same layers on disk.
x-app-base: &app-base
  build: .
  platform: linux/amd64
  image: fyp_tennis_backend:dev
  entrypoint: /entrypoint.sh
  env_file:
    - .env
  environment:
    UV_PROJECT_ENVIRONMENT: /opt/venv
    DATABASE_URL: ${DATABASE_URL}
  volumes:
    - .:/app

services:
  api:
    <<: *app-base
    container_name: tennis_api
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 7000"
    ports:
      - "7000:7000"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  celery_worker:
    <<: *app-base
    runtime: nvidia
    container_name: tennis_celery_worker
    command: uv run celery -A src.celery.worker worker --loglevel=info --concurrency=1
    depends_on:
      - redis
      - rabbitmq

  flower:
    <<: *app-base
    container_name: tennis_flower
    command: uv run celery --broker=amqp://guest:guest@rabbitmq:5672// flower --port=5555
    ports:
      - "5556:5555"
    depends_on:
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    platform: linux/amd64
    container_name: tennis_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  adminer:
    image: adminer
    platform: linux/amd64
    container_name: tennis_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  redis:
    image: redis:7
    platform: linux/amd64
    container_name: tennis_redis
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: rabbitmq:3-management
    platform: linux/amd64
    container_name: tennis_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
