version: "3.9"

services:
  api:
    build: .
    container_name: tennis_api
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 7000 --reload
    volumes:
      - .:/app
    ports:
      - "7000:7000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq

  celery_worker:
    build: .
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    container_name: tennis_celery_worker
    command: uv run celery -A src.celery.worker worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  flower:
    build: .
    container_name: tennis_flower
    command: uv run celery --broker=amqp://guest:guest@rabbitmq:5672// flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

  postgres:
    image: postgres:15
    container_name: tennis_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acevision
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tennis_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tennis_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
