[project]
name = "tennisproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "matplotlib>=3.1.2",
    "scenedetect>=0.6.1",
    "numpy>=1.19.3",
    "scipy>=1.3.1",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "pandas>=1.1.5",
    "sympy>=1.9",
    "tqdm>=4.42.1",
    "opencv_python>=4.1.2.30",
    "catboost>=1.1.1",
    "ultralytics",
    "supervision",
    "fastapi[standard]>=0.118.0",
    "sqlmodel>=0.0.25",
    "alembic[tz]>=1.18.4",
    "sqlalchemy>=2.0.43",
    "python-dotenv>=1.1.1",
    "psycopg2-binary>=2.9.7",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.12.0",
    "celery[redis]>=5.6.2",
    "flower>=2.0.1",
    "redis>=6.4.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "jinja2>=3.1.6",
]

[tool.uv]
extra-index-url = [
    "https://pypi.org/simple"
]

[tool.uv.sources]
torch = [
    { index = "torch-gpu", marker = "platform_system == 'Windows'"},
]

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
