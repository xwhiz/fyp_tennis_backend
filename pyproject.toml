[project]
name = "tennisproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "matplotlib>=3.1.2",
    "scenedetect>=0.6.1",
    "numpy>=1.19.3",
    "scipy>=1.3.1",
    "pandas>=1.1.5",
    "sympy>=1.9",
    "tqdm>=4.42.1",
    "opencv_python>=4.1.2.30",
    "catboost>=1.1.1",
    "supervision>=0.27.0.post2",
    "ultralytics>=8.4.36",
    "fastapi[standard]>=0.118.0",
    "sqlmodel>=0.0.25",
    "alembic[tz]>=1.18.4",
    "sqlalchemy>=2.0.43",
    "python-dotenv>=1.1.1",
    "psycopg2-binary>=2.9.7",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.12.0",
    "celery[redis]>=5.6.2",
    "flower>=2.0.1",
    "redis>=6.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "yt-dlp>=2026.3.17",
    "bcrypt>=4.3.0",
    "pyjwt>=2.10.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no HTTP, no external services).",
    "integration: Integration tests (API with test DB).",
    "system: System / smoke / e2e tests (may need external services).",
    "performance: Performance tests (latency, throughput).",
    "security: Security tests (path traversal, input validation).",
]
